[project]
name = "credit-risk-classification"
version = "0.1.0"
description = "Clasificación de riesgo crediticio (default) para una cooperativa financiera, servida con Streamlit."
readme = "README.md"
requires-python = ">=3.11,<3.12"

# Dependencias de RUNTIME: lo único que necesita la app para servir los modelos.
# Es lo que se instala en la imagen Docker y en requirements.txt.
dependencies = [
    "joblib>=1.3",
    # scikit-learn y lightgbm van fijados a la versión con la que se
    # serializaron los modelos de models/. Cambiarlos implica reentrenar
    # (tests/test_models.py falla si las versiones no coinciden).
    "lightgbm==4.6.0",
    "matplotlib>=3.7.0",  # requerido por pandas Styler.background_gradient
    "numpy",
    "pandas",
    "plotly",
    "pyarrow",
    "scikit-learn==1.4.2",
    "streamlit",
]

[dependency-groups]
# Herramientas de desarrollo: calidad de código y pruebas.
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.17",
]
# Exploración, AutoML y entrenamiento (notebooks/). No va a producción.
notebooks = [
    "ipykernel>=6.29.0",
    "ipython>=8.0.0",
    "nbformat>=5.9.0",
    "notebook>=7.0.0",
    "optuna>=4.8.0",
    "pycaret==3.3.2",
    "scipy",
    "seaborn",
    "shap>=0.49.1",
    "statsmodels",
]

[tool.uv]
# Es una aplicación, no una librería: no se construye ni se instala como paquete.
package = false
# `uv sync` en local instala todo; CI y Docker eligen grupos explícitamente.
default-groups = ["dev", "notebooks"]

# ─────────────────────────────────────────────
# Ruff (lint + formato)
# ─────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
# Los notebooks son artefactos de análisis; no se reformatean automáticamente.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (seguridad)
    "PT",  # flake8-pytest-style
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert es la forma idiomática en pytest
"app.py" = ["E402"]     # los warnings se silencian antes de importar las librerías de ML

# ─────────────────────────────────────────────
# Pytest + coverage
# ─────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov",
    "--cov-report=term-missing",
]
markers = [
    "slow: pruebas lentas (app completa, evaluación de modelos)",
]
filterwarnings = [
    # Un modelo cargado con una versión de scikit-learn distinta a la de
    # entrenamiento debe romper el build, no ser un warning silencioso.
    "error::sklearn.exceptions.InconsistentVersionWarning",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "notebooks/*", ".venv/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
