# ─────────────────────────────────────────────
# CD — entrega continua.
#
#   push a main      → CI completo → imagen publicada en GHCR (:main, :sha-xxxxxxx)
#   tag vX.Y.Z       → CI completo → imagen (:X.Y.Z, :X.Y, :latest)
#                      → GitHub Release con notas → despliegue a "production"
#
# La imagen se construye una sola vez por commit y se promueve por digest:
# lo que se despliega es exactamente lo que se probó y escaneó.
# ─────────────────────────────────────────────
name: CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publicar imagen en GHCR
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Nombre de la imagen (GHCR exige minúsculas)
        id: vars
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login en GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags y etiquetas OCI
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Construir y publicar (amd64 + arm64, con SBOM y provenance)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Resumen
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Imagen publicada"
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo "Tags:"
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  scan:
    name: Escaneo de la imagen publicada
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Login en GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy (SARIF para la pestaña Security)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: image
          image-ref: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
          scanners: vuln,secret
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif

      - name: Subir resultados a GitHub code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

  release:
    name: GitHub Release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Crear release con notas generadas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --notes "**Imagen:** \`${IMAGE}:${GITHUB_REF_NAME#v}\` (\`${DIGEST}\`)"

  deploy:
    name: Desplegar a producción
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [publish, scan, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # El environment permite exigir aprobación manual y restringir qué
    # tags pueden desplegar (Settings → Environments → production).
    environment: production
    steps:
      - name: Disparar despliegue
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          IMAGE_REF: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
        run: |
          if [ -z "${DEPLOY_HOOK_URL}" ]; then
            echo "::notice::El secreto DEPLOY_HOOK_URL no está configurado en el environment 'production'; se omite el despliegue. Imagen lista: ${IMAGE_REF}"
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --max-time 30 \
            -X POST -H "Content-Type: application/json" \
            --data "{\"image\": \"${IMAGE_REF}\", \"version\": \"${GITHUB_REF_NAME}\"}" \
            "${DEPLOY_HOOK_URL}" > /dev/null
          echo "Despliegue solicitado para ${IMAGE_REF}" >> "$GITHUB_STEP_SUMMARY"
