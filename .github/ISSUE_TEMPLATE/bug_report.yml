name: Reporte de error
description: Algo no funciona como se espera
labels: [bug]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: ¿Qué pasó?
      description: Describe el error y qué esperabas que ocurriera.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrir la pestaña ...
        2. Configurar el umbral en ...
        3. Ver el error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión / tag de la imagen
      placeholder: "v1.2.0 o sha-abc1234"
  - type: textarea
    id: logs
    attributes:
      label: Logs o capturas
      render: shell
